name: Static checks
on:
  push:
    branches: [anytouch2-clean]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
      - run: uv python install 3.11
      - run: uv lock --check
      - run: uvx --from ruff==0.11.12 ruff check .
      - run: python3 -m compileall -q src scripts examples packages
# Runtime tests require the locked CUDA environment and Transformers patch;
# run the CPU regression command documented in README.md on the development host.
